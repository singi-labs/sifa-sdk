version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # react and react-dom must stay on the exact same version.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # gh-aw lock files must be recompiled by the gh-aw CLI of the same
      # version as the setup action they pin. A bare Dependabot bump of the
      # action skews the two and breaks safe outputs. Upgrade with
      # `gh aw upgrade` + `gh aw compile` instead.
      - dependency-name: 'github/gh-aw-actions*'
