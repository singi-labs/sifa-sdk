name: Release
# Auto-merge is enabled with CHANGESETS_TOKEN (see auto-enable-automerge.yml),
# so the merge commit's push to main is attributed to a real identity and
# triggers this workflow -- no manual squash-merge needed. (Resolved #155.)
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      # Install pnpm via npm (bundled with Node, no corepack on Node 26+)
      # instead of pnpm/action-setup's self-installer, which intermittently
      # fails the registry fetch (ERR_INVALID_THIS → "Cannot find module
      # '../lib/cli.js'"). Pinned to the packageManager version.
      - name: Install pnpm
        run: npm install -g --ignore-scripts pnpm@10.30.1

      - name: Install
        # Defensive retry against transient pnpm install failures, mirroring the
        # CI workflow. This job runs on ubuntu-latest (fresh per-run store), so
        # the shared self-hosted store race (sifa-web#1261) doesn't apply here --
        # the retry is just cheap insurance against generic transient blips.
        run: |
          attempt=1
          max=3
          until pnpm install --frozen-lockfile --ignore-scripts; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::pnpm install failed after ${max} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "::warning::pnpm install failed (attempt ${attempt}/${max}); retrying in ${delay}s" >&2
            attempt=$((attempt + 1))
            sleep "$delay"
          done

      - name: Build
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      # Trusted-publisher OIDC publish auth requires npm >=11.6.0. Pin to the
      # newest 11.x rather than @latest: npm 12.0.0 broke `npm publish
      # --provenance` with "Cannot find module 'sigstore'" (its provenance path
      # can no longer resolve sigstore), which fails every trusted-publishing
      # release. 11.9.0 keeps OIDC + provenance working. Revisit once a 12.x
      # patch restores provenance.
      - name: Pin npm for trusted publishing
        run: npm install -g --ignore-scripts npm@11.9.0

      # Install only the changeset CLI globally — no project deps and no
      # lifecycle scripts run in this job. The full dep graph stays in the
      # build job; the publish job that holds the OIDC token never executes
      # arbitrary package code.
      - name: Install changesets CLI
        run: npm install -g --ignore-scripts @changesets/cli@2.31.0

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Fail fast if the runner isn't actually exposing OIDC to this job.
      # `id-token: write` permission must be set (it is, at job level), and the
      # runner must populate ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN. If either is
      # missing, npm publish will silently fall back to ENEEDAUTH later — much
      # easier to debug here than from the changesets/action subprocess output.
      - name: Verify OIDC environment
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC env vars not present — id-token permission missing or not propagated"
            exit 1
          fi
          echo "OIDC env vars present"
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Call the global changeset binary directly — no pnpm in the chain,
          # no project install required in this job.
          version: changeset version
          # Call npm publish directly (via a small node script) instead of
          # `pnpm release` → `changeset publish` → `pnpm publish`. The pnpm
          # chain injects NPM_CONFIG_* env vars that prevent npm 11.6+ from
          # engaging OIDC trusted publishing (see issue #68 for the full
          # investigation and failed-run logs).
          publish: node scripts/publish-if-new.mjs
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

      # Best-effort notification: a successful npm publish must not be reported
      # as a failed release just because the downstream docs ping fails. Needs
      # CROSS_REPO_DISPATCH_TOKEN to have Contents:write (dispatch) on
      # singi-labs/sifa-docs; see singi-labs/sifa-sdk#350.
      - name: Trigger sifa-docs rebuild
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          repository: singi-labs/sifa-docs
          event-type: sifa-sdk-released
          client-payload: |
            {
              "version": "${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}",
              "package": "${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].name }}"
            }
