name: Release
# Note: auto-merged PRs (GITHUB_TOKEN actor) do not trigger push events on main,
# so Release is silently skipped. Manually click squash-merge on PRs that need
# to publish (feature PRs with changesets AND the resulting "version packages"
# PRs) until #155 is resolved.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.30.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      # Trusted-publisher OIDC publish auth requires npm >=11.6.0.
      # Pin to latest npm so publishes work regardless of which 26.x
      # patch the setup-node cache resolves to.
      - name: Upgrade npm for trusted publishing
        run: npm install -g --ignore-scripts npm@latest

      # Install only the changeset CLI globally — no project deps and no
      # lifecycle scripts run in this job. The full dep graph stays in the
      # build job; the publish job that holds the OIDC token never executes
      # arbitrary package code.
      - name: Install changesets CLI
        run: npm install -g --ignore-scripts @changesets/cli@2.31.0

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Fail fast if the runner isn't actually exposing OIDC to this job.
      # `id-token: write` permission must be set (it is, at job level), and the
      # runner must populate ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN. If either is
      # missing, npm publish will silently fall back to ENEEDAUTH later — much
      # easier to debug here than from the changesets/action subprocess output.
      - name: Verify OIDC environment
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC env vars not present — id-token permission missing or not propagated"
            exit 1
          fi
          echo "OIDC env vars present"
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          # Call the global changeset binary directly — no pnpm in the chain,
          # no project install required in this job.
          version: changeset version
          # Call npm publish directly (via a small node script) instead of
          # `pnpm release` → `changeset publish` → `pnpm publish`. The pnpm
          # chain injects NPM_CONFIG_* env vars that prevent npm 11.6+ from
          # engaging OIDC trusted publishing (see issue #68 for the full
          # investigation and failed-run logs).
          publish: node scripts/publish-if-new.mjs
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

      - name: Trigger sifa-docs rebuild
        if: steps.changesets.outputs.published == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          repository: singi-labs/sifa-docs
          event-type: sifa-sdk-released
          client-payload: |
            {
              "version": "${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}",
              "package": "${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].name }}"
            }
