name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    uses: singi-labs/.github/.github/workflows/ai-review-reusable.yml@main
    secrets: inherit
    with:
      profile: backend
