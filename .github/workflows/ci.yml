name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted-sifa' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      # Install pnpm via npm (bundled with Node, no corepack on Node 26+)
      # instead of pnpm/action-setup's self-installer, which intermittently
      # fails the registry fetch on the self-hosted runner (ERR_INVALID_THIS →
      # "Cannot find module '../lib/cli.js'"). Same global-install pattern the
      # release publish job uses. Pinned to the packageManager version.
      - name: Install pnpm
        run: npm install -g --ignore-scripts pnpm@10.30.1

      - name: Install
        # Retry transient pnpm copyfile ENOENT races on the shared self-hosted
        # pnpm store (the host's default store is shared across jobs).
        # See sifa-web#1261.
        run: |
          attempt=1
          max=3
          until pnpm install --frozen-lockfile --ignore-scripts; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::pnpm install failed after ${max} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "::warning::pnpm install failed (attempt ${attempt}/${max}); retrying in ${delay}s" >&2
            attempt=$((attempt + 1))
            sleep "$delay"
          done

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit
        # npm retired the audit endpoints `pnpm audit` calls (HTTP 410, see
        # https://api-docs.npmjs.com/#tag/Audit), so this step now always
        # errors on the endpoint rather than on real advisories -- it blocks
        # every PR. Keep it running for visibility but non-blocking until
        # auditing is restored via a maintained path (bulk advisory endpoint /
        # Dependabot / Socket). Follow-up: singi-labs/sifa-sdk#298.
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
