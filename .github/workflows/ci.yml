name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted-sifa' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.30.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        # Retry transient pnpm copyfile ENOENT races on the shared self-hosted
        # store (cache: pnpm, shared across jobs on the host). See sifa-web#1261.
        run: |
          attempt=1
          max=3
          until pnpm install --frozen-lockfile --ignore-scripts; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::pnpm install failed after ${max} attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "::warning::pnpm install failed (attempt ${attempt}/${max}); retrying in ${delay}s" >&2
            attempt=$((attempt + 1))
            sleep "$delay"
          done

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false
