name: Auto-enable auto-merge on new PRs

# Flip GitHub's native auto-merge on for every non-draft PR targeting main.
# Closes the common failure mode of a PR sitting green forever because nobody
# ran `gh pr merge --auto --squash`.

on:
  pull_request:
    types:
      - opened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash
