name: CLA Assistant

# Gates PR merges on a signed Contributor License Agreement.
# Signatures are stored centrally in singi-labs/.github at signatures/cla.json.
# A contributor signs once (any singi-labs repo) by commenting on their PR:
#   I have read the CLA Document and I hereby sign the CLA
#
# Requires an org secret CLA_SIGNATURES_PAT (fine-grained PAT with Contents:write
# on the singi-labs/.github repo) so the action can record signatures.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_PAT }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/singi-labs/.github/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: gxjansen,dependabot[bot],*[bot]
          remote-organization-name: singi-labs
          remote-repository-name: .github
